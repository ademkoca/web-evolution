<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#ffcc00"/>
      <rect x="8" width="8" height="16" fill="#111"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="#008080"/>
  <!-- window -->
  <rect x="24" y="20" width="432" height="282" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
  <rect x="28" y="24" width="424" height="20" fill="#000080"/>
  <text x="34" y="38" font-size="12" font-weight="700" fill="#fff">Welcome to My Homepage! - Navigator</text>
  <rect x="420" y="27" width="14" height="14" fill="#c0c0c0"/>
  <rect x="436" y="27" width="14" height="14" fill="#c0c0c0"/>
  <text x="439" y="38" font-size="11" font-weight="700">x</text>
  <!-- address bar -->
  <text x="34" y="62" font-size="11">Location:</text>
  <rect x="88" y="51" width="356" height="16" fill="#fff" stroke="#808080"/>
  <text x="92" y="63" font-size="11" fill="#000">http://www.example.com/~homepage/</text>
  <!-- page -->
  <rect x="32" y="74" width="416" height="220" fill="#ffffff" stroke="#808080"/>
  <text x="240" y="106" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#000080">Welcome to my homepage!!!</text>
  <rect x="120" y="120" width="240" height="30" fill="url(#stripes)"/>
  <rect x="140" y="125" width="200" height="20" fill="#ffff99"/>
  <text x="240" y="140" text-anchor="middle" font-size="12" font-weight="700">UNDER CONSTRUCTION</text>
  <line x1="60" y1="166" x2="420" y2="166" stroke="#808080" stroke-width="2"/>
  <text x="70" y="188" font-size="13" fill="#0000ee" text-decoration="underline">My cool links</text>
  <text x="200" y="188" font-size="13" fill="#0000ee" text-decoration="underline">Sign my guestbook</text>
  <text x="350" y="188" font-size="13" fill="#551a8b" text-decoration="underline">About me</text>
  <text x="240" y="222" text-anchor="middle" font-family="Times New Roman, serif" font-size="13" fill="#800000">Best viewed in 800x600</text>
  <rect x="170" y="240" width="140" height="22" fill="#000" stroke="#808080" stroke-width="2"/>
  <text x="240" y="256" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#00ff00" letter-spacing="3">004217</text>
  <text x="240" y="282" text-anchor="middle" font-size="11" fill="#404040">visitors since 1996</text>
</svg>
